# Cloudflare Workers 部署配置
#
#   npm run worker:dev      本地跑（不需要账号）
#   npm run worker:deploy   部署到线上

name = "blokus-online"
main = "worker/index.js"
compatibility_date = "2025-01-01"

# 自定义域名。国内无法访问 *.workers.dev，必须绑自己的域名
# （域名需已加入 Cloudflare 且状态为 Active）。
# 未准备好时注释掉这段，可照常部署到 workers.dev。
routes = [
  { pattern = "blokus.ookura-resona.xyz", custom_domain = true },
]

# 静态资源：dist/ 由 tools/build-assets.js 生成
[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "none"

[build]
command = "node tools/build-assets.js"

# 一个房号 = 一个 Durable Object
[[durable_objects.bindings]]
name = "ROOMS"
class_name = "RoomDurableObject"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RoomDurableObject"]

[vars]
AI_DELAY_MS = "650"
OFFLINE_TAKEOVER_MS = "30000"

[observability]
enabled = true
